<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Overload | Cyber Clicker</title>
    <style>
        :root {
            --bg-color: #05050a;
            --panel-bg: #0f172a;
            --accent: #00ff66;
            --accent-glow: rgba(0, 255, 102, 0.4);
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --border: #1e293b;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-container {
            width: 100%;
            max-width: 500px;
            background: var(--panel-bg);
            border: 2px solid var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        h1 {
            color: var(--accent);
            font-size: 22px;
            margin-top: 0;
            text-shadow: 0 0 10px var(--accent-glow);
        }
        .stats {
            background: #030712;
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .stats p {
            margin: 5px 0;
            font-size: 16px;
        }
        .data-display {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent);
        }
        /* Большая кнопка хака */
        #hackBtn {
            width: 100%;
            height: 120px;
            background: linear-gradient(135deg, #064e3b, #022c22);
            border: 2px solid var(--accent);
            color: var(--accent);
            font-size: 20px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 15px var(--accent-glow);
            transition: all 0.1s ease;
            margin-bottom: 20px;
        }
        #hackBtn:active {
            transform: scale(0.96);
            background: linear-gradient(135deg, #022c22, #064e3b);
        }
        .shop-section {
            border-top: 1px solid var(--border);
            padding-top: 15px;
            text-align: left;
        }
        .shop-title {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .upgrade-btn {
            width: 100%;
            background: #1e293b;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        .upgrade-btn:hover {
            background: #334155;
            border-color: var(--accent);
        }
        .upgrade-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>[ NEURAL OVERLOAD ]</h1>
        
        <div class="stats">
            <p>Добыто данных:</p>
            <div class="data-display"><span id="dataCount">0</span> БАЙТ</div>
            <p style="font-size: 12px; color: var(--text-muted); margin-top: 8px;">Скорость: +<span id="cpsCount">0</span> байт/сек</p>
        </div>

        <!-- Основная кнопка клика -->
        <button id="hackBtn" onclick="collectData()">ВЗЛОМАТЬ СЕРВЕР</button>

        <!-- Магазин апгрейдов -->
        <div class="shop-section">
            <div class="shop-title">Апгрейды сети:</div>
            
            <button class="upgrade-btn" id="up1" onclick="buyUpgrade(1)">
                <span>🤖 Бот-паук (+1/сек)</span>
                <span id="cost1">15 байт</span>
            </button>
            
            <button class="upgrade-btn" id="up2" onclick="buyUpgrade(2)">
                <span>⚡ Квантовый чип (+5/сек)</span>
                <span id="cost2">100 байт</span>
            </button>
        </div>
    </div>

    <script>
        let data = 0;
        let cps = 0; // байт в секунду

        // Цены и прирост улучшений
        let upgrades = {
            1: { cost: 15, power: 1, count: 0, costMultiplier: 1.15 },
            2: { cost: 100, power: 5, count: 0, costMultiplier: 1.20 }
        };

        // Клик по кнопке взлома
        function collectData() {
            data += 1;
            updateDisplay();
        }

        // Покупка улучшений
        function buyUpgrade(id) {
            let up = upgrades[id];
            if (data >= up.cost) {
                data -= up.cost;
                cps += up.power;
                up.count += 1;
                up.cost = Math.floor(up.cost * up.costMultiplier);
                updateDisplay();
            }
        }

        // Обновление интерфейса
        function updateDisplay() {
            document.getElementById('dataCount').innerText = data;
            document.getElementById('cpsCount').innerText = cps;
            
            document.getElementById('cost1').innerText = upgrades[1].cost + ' байт';
            document.getElementById('cost2').innerText = upgrades[2].cost + ' байт';

            // Блокировка кнопок, если не хватает байт
            document.getElementById('up1').disabled = data < upgrades[1].cost;
            document.getElementById('up2').disabled = data < upgrades[2].cost;
        }

        // Автоматический сбор данных каждую секунду (пассивный доход)
        setInterval(function() {
            if (cps > 0) {
                data += cps;
                updateDisplay();
            }
        }, 1000);
    </script>

</body>
</html>
