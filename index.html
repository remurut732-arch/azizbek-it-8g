<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberCore | Neural Overload</title>
    <style>
        :root {
            --bg-color: #05050a;
            --panel-bg: #0f172a;
            --accent: #00ff66;
            --accent-glow: rgba(0, 255, 102, 0.3);
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --border: #1e293b;
            --danger: #ef4444;
            --warning: #f59e0b;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-container {
            width: 100%;
            max-width: 500px;
            background: var(--panel-bg);
            border: 2px solid var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            color: var(--accent);
            font-size: 20px;
            margin-top: 0;
            text-align: center;
            text-shadow: 0 0 10px var(--accent-glow);
        }
        .rank-title {
            text-align: center;
            font-size: 13px;
            color: var(--warning);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .stats {
            background: #030712;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }
        .data-display {
            font-size: 22px;
            font-weight: bold;
            color: var(--accent);
            margin: 5px 0;
        }
        /* Главная кнопка */
        #hackBtn {
            width: 100%;
            height: 100px;
            background: linear-gradient(135deg, #064e3b, #022c22);
            border: 2px solid var(--accent);
            color: var(--accent);
            font-size: 18px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 15px var(--accent-glow);
            transition: all 0.08s ease;
            margin-bottom: 15px;
        }
        #hackBtn:active {
            transform: scale(0.97);
            background: linear-gradient(135deg, #022c22, #064e3b);
        }
        /* Консоль логов */
        .console-log {
            background: #000;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            font-size: 11px;
            color: #38bdf8;
            height: 45px;
            overflow: hidden;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        /* Магазин */
        .shop-section {
            border-top: 1px solid var(--border);
            padding-top: 12px;
        }
        .shop-title {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .upgrade-btn {
            width: 100%;
            background: #1e293b;
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        .upgrade-btn:hover {
            background: #334155;
            border-color: var(--accent);
        }
        .upgrade-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .upgrade-info {
            text-align: right;
            font-size: 11px;
            color: var(--warning);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>[ CYBERCORE : OVERLOAD ]</h1>
        <div class="rank-title" id="rankText">Ранг: Скрипт-кидди</div>
        
        <div class="stats">
            <div style="font-size: 12px; color: var(--text-muted);">БАЗА ДАННЫХ:</div>
            <div class="data-display"><span id="dataCount">0</span> БАЙТ</div>
            <div style="font-size: 11px; color: var(--text-muted);">Скорость добычи: +<span id="cpsCount">0</span> байт/сек</div>
        </div>

        <button id="hackBtn" onclick="collectData()">⚡ ВЗЛОМАТЬ СЕРВЕР (+1)</button>

        <!-- Лог терминала -->
        <div class="console-log" id="consoleLog">
            > Система инициализирована. Ожидание команд...
        </div>

        <!-- Магазин расширенной прокачки -->
        <div class="shop-section">
            <div class="shop-title">Модули взлома и апгрейды:</div>
            
            <button class="upgrade-btn" id="up1" onclick="buyUpgrade(1)">
                <span>🤖 Авто-скрипт (+1/сек)</span>
                <span class="upgrade-info" id="info1">15 Б<br>Куплено: 0</span>
            </button>
            
            <button class="upgrade-btn" id="up2" onclick="buyUpgrade(2)">
                <span>🌐 Ботнет-сеть (+6/сек)</span>
                <span class="upgrade-info" id="info2">100 Б<br>Куплено: 0</span>
            </button>

            <button class="upgrade-btn" id="up3" onclick="buyUpgrade(3)">
                <span>🛰️ Квантовый узел (+30/сек)</span>
                <span class="upgrade-info" id="info3">550 Б<br>Куплено: 0</span>
            </button>

            <button class="upgrade-btn" id="up4" onclick="buyUpgrade(4)">
                <span>🧠 ИИ-автопилот (+150/сек)</span>
                <span class="upgrade-info" id="info4">2500 Б<br>Куплено: 0</span>
            </button>
        </div>
    </div>

    <script>
        let data = 0;
        let cps = 0; 
        let clickPower = 1;

        // Конфигурация улучшений
        let upgrades = {
            1: { cost: 15, power: 1, count: 0, mult: 1.15, name: "Авто-скрипт" },
            2: { cost: 100, power: 6, count: 0, mult: 1.18, name: "Ботнет-сеть" },
            3: { cost: 550, power: 30, count: 0, mult: 1.20, name: "Квантовый узел" },
            4: { cost: 2500, power: 150, count: 0, mult: 1.22, name: "ИИ-автопилот" }
        };

        const logs = [
            "Пакет данных успешно перехвачен...",
            "Сканирование портов корпорации завершено...",
            "Обход защитного файрвола выполнен...",
            "Обнаружена уязвимость в подсистеме...",
            "Синхронизация квантовых потоков..."
        ];

        function collectData() {
            data += clickPower;
            updateDisplay();
            
            // Шанс показать рандомный лог
            if (Math.random() < 0.3) {
                const randomLog = logs[Math.floor(Math.random() * logs.length)];
                document.getElementById('consoleLog').innerText = "> " + randomLog;
            }
        }

        function buyUpgrade(id) {
            let up = upgrades[id];
            if (data >= up.cost) {
                data -= up.cost;
                cps += up.power;
                up.count += 1;
                data = Math.floor(data);
                up.cost = Math.floor(up.cost * up.mult);
                
                document.getElementById('consoleLog').innerText = "> Установлен модуль: " + up.name;
                updateDisplay();
            }
        }

        function updateDisplay() {
            document.getElementById('dataCount').innerText = data.toLocaleString();document.getElementById('cpsCount').innerText = cps.toLocaleString();
            
            for (let i = 1; i <= 4; i++) {
                document.getElementById('info' + i).innerHTML = upgrades[i].cost.toLocaleString() + ' Б<br>Куплено: ' + upgrades[i].count;
                document.getElementById('up' + i).disabled = data < upgrades[i].cost;
            }

            // Динамические ранги
            let rank = "Скрипт-кидди";
            if (data >= 5000) rank = "Элитный хакер";
            if (data >= 25000) rank = "Кибер-архитектор";
            if (data >= 100000) rank = "Искусственный Интеллект (GOD MODE)";
            document.getElementById('rankText').innerText = "Ранг: " + rank;
        }

        // Пассивный доход каждую секунду
        setInterval(function() {
            if (cps > 0) {
                data += cps;
                updateDisplay();
            }
        }, 1000);
    </script>

</body>
</html>
